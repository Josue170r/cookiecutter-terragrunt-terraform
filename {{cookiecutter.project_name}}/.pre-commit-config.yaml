exclude: '\.terragrunt-cache/'
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: end-of-file-fixer
      stages: [pre-commit]
    - id: trailing-whitespace
      stages: [pre-commit]
    - id: check-merge-conflict
      stages: [pre-commit]
    - id: detect-aws-credentials
      stages: [pre-commit]
