---
# create_users.yml
#
# Uso:
#   make ansible-run PLAYBOOK=create_users
#
# Antes de correrlo:
#   1. Etiqueta la(s) instancia(s) donde se deba ejecutar con el tag:
#        AnsibleGroup=create-user
#      (generate_inventory.py las agrupa bajo [create-user] en hosts.ini,
#      que es el grupo que este playbook usa como target)
#   2. Crea ansible/vars/users.yml (NO se sube a git) con esta estructura:
#        usuarios:
#          - name: user.1
#            password: AltanRedes1
#          - name: user.2
#            password: OtraPassword2
#

- name: Crear usuarios con llave SSH y password temporal
  hosts: create-user-im
  become: false
  gather_facts: false
  vars_files:
    - "{% raw %}{{ playbook_dir }}/../vars/users.yml{% endraw %}"
  vars:
    home_base: /home
    local_output_dir: "{% raw %}{{ playbook_dir }}/generated{% endraw %}"
    ansible_remote_tmp: "{% raw %}/tmp/.ansible-{{ inventory_hostname }}/tmp{% endraw %}"
    ansible_aws_ssm_timeout: 180
    ansible_python_interpreter: /usr/bin/python3
    ansible_aws_ssm_document: AnsibleCreateUserRootSession

  tasks:
    - name: Abortar si el grupo create-user está vacío (ninguna instancia con el tag)
      ansible.builtin.assert:
        that:
          - "{% raw %}ansible_play_hosts_all | length > 0{% endraw %}"
        fail_msg: >-
          No hay instancias en el grupo 'create-user'. Verifica que la
          instancia tenga el tag AnsibleGroup=create-user y que el
          inventario se haya regenerado (make ansible-inventory).
      run_once: true

    - name: Abortar si no hay usuarios definidos en vars/users.yml
      ansible.builtin.assert:
        that:
          - "{% raw %}usuarios is defined{% endraw %}"
          - "{% raw %}usuarios | length > 0{% endraw %}"
        fail_msg: >-
          Define la lista 'usuarios' en {% raw %}{{ playbook_dir }}/../vars/users.yml{% endraw %}
      run_once: true

    - name: Crear carpeta local de salida
      become: false
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{% raw %}{{ local_output_dir }}{% endraw %}"
        state: directory
        mode: "0700"

    - name: Crear usuario con home en /home/<usuario>
      ansible.builtin.user:
        name: "{% raw %}{{ item.name }}{% endraw %}"
        home: "{% raw %}{{ home_base }}/{{ item.name }}{% endraw %}"
        create_home: true
        shell: /bin/bash
        state: present
      loop: "{% raw %}{{ usuarios }}{% endraw %}"

    - name: Verificar si ya existe la llave final .pem por usuario
      become: false
      delegate_to: localhost
      run_once: true
      ansible.builtin.stat:
        path: "{% raw %}{{ local_output_dir }}/{{ item.name }}.pem{% endraw %}"
      loop: "{% raw %}{{ usuarios }}{% endraw %}"
      register: pem_stat

    - name: Generar par de llaves RSA (PEM) localmente, solo si no existen ya
      become: false
      delegate_to: localhost
      run_once: true
      community.crypto.openssh_keypair:
        path: "{% raw %}{{ local_output_dir }}/{{ item.item.name }}{% endraw %}"
        type: ecdsa
        size: 521
        backend: cryptography
        comment: "{% raw %}{{ item.item.name }}@altan-managed{% endraw %}"
        mode: "0600"
      loop: "{% raw %}{{ pem_stat.results }}{% endraw %}"
      loop_control:
        label: "{% raw %}{{ item.item.name }}{% endraw %}"
      when: "{% raw %}not item.stat.exists{% endraw %}"
      register: generated_keys

    - name: Renombrar la llave privada a extensión .pem
      become: false
      delegate_to: localhost
      run_once: true
      ansible.builtin.command: >-
        mv "{% raw %}{{ local_output_dir }}/{{ item.item.name }}{% endraw %}"
          "{% raw %}{{ local_output_dir }}/{{ item.item.name }}.pem{% endraw %}"
      loop: "{% raw %}{{ pem_stat.results }}{% endraw %}"
      loop_control:
        label: "{% raw %}{{ item.item.name }}{% endraw %}"
      when: "{% raw %}not item.stat.exists{% endraw %}"

    - name: Crear directorio .ssh del usuario
      ansible.builtin.file:
        path: "{% raw %}{{ home_base }}/{{ item.name }}/.ssh{% endraw %}"
        state: directory
        owner: "{% raw %}{{ item.name }}{% endraw %}"
        group: "{% raw %}{{ item.name }}{% endraw %}"
        mode: "0700"
      loop: "{% raw %}{{ usuarios }}{% endraw %}"

    - name: Instalar la llave pública en authorized_keys
      ansible.posix.authorized_key:
        user: "{% raw %}{{ item.name }}{% endraw %}"
        key: "{% raw %}{{ lookup('file', local_output_dir + '/' + item.name + '.pub') }}{% endraw %}"
        exclusive: true
        state: present
      loop: "{% raw %}{{ usuarios }}{% endraw %}"

    - name: Asegurar permisos correctos de authorized_keys
      ansible.builtin.file:
        path: "{% raw %}{{ home_base }}/{{ item.name }}/.ssh/authorized_keys{% endraw %}"
        owner: "{% raw %}{{ item.name }}{% endraw %}"
        group: "{% raw %}{{ item.name }}{% endraw %}"
        mode: "0600"
      loop: "{% raw %}{{ usuarios }}{% endraw %}"

    - name: Asignar password al usuario (desde vars/users.yml)
      ansible.builtin.user:
        name: "{% raw %}{{ item.item.name }}{% endraw %}"
        password: "{% raw %}{{ item.item.password | string }}{% endraw %}"
      loop: "{% raw %}{{ pem_stat.results }}{% endraw %}"
      loop_control:
        label: "{% raw %}{{ item.item.name }}{% endraw %}"
      when: "{% raw %}not item.stat.exists{% endraw %}"
      no_log: true

    - name: Forzar cambio de password en el primer login
      ansible.builtin.command: "{% raw %}chage -d 0 {{ item.item.name }}{% endraw %}"
      loop: "{% raw %}{{ pem_stat.results }}{% endraw %}"
      loop_control:
        label: "{% raw %}{{ item.item.name }}{% endraw %}"
      when: "{% raw %}not item.stat.exists{% endraw %}"
      changed_when: true

    - name: Quitar al usuario de los grupos (sudo/wheel), si pertenece
      ansible.builtin.command: "{% raw %}gpasswd -d {{ item.0.name }} {{ item.1 }}{% endraw %}"
      loop: "{% raw %}{{ usuarios }}{% endraw %}"
      loop_control:
        label: "{% raw %}{{ item.0.name }} / {{ item.1 }}{% endraw %}"
      register: remove_admin_group
      failed_when:
        - "{% raw %}remove_admin_group.rc != 0{% endraw %}"
        - "{% raw %}'is not a member' not in remove_admin_group.stderr{% endraw %}"
        - "{% raw %}'does not exist' not in remove_admin_group.stderr{% endraw %}"
      changed_when: "{% raw %}remove_admin_group.rc == 0{% endraw %}"

    - name: Summary
      become: false
      delegate_to: localhost
      run_once: true
      ansible.builtin.debug:
        msg: >-
          Usuario {% raw %}{{ item.name }}{% endraw %} creado (misma llave/password en todas las
          instancias del grupo). Llave privada: {% raw %}{{ local_output_dir }}/{{ item.name }}.pem{% endraw %}
      loop: "{% raw %}{{ usuarios }}{% endraw %}"